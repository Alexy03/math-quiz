<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Math Quiz </h1>
	<h3>Mode Selector</h3>
    
    <!-- Buttons to toggle between Normal and Timer mode -->
    <button id="normalMode" onclick="startNormalMode()">Normal Mode</button>
    <button id="timerMode" onclick="startTimerMode()">Timer Mode</button>
    
    <div id="question"></div>
    <input type="number" id="answer" placeholder="Enter your answer">
    <button onclick="checkAnswer()">Submit</button>

    <div id="result"></div>
    <div id="timer" style="display: none;">Time Left: 60s</div>
    <div id="score">Score: 0</div>
    <div id="classification" style="font-weight: bold; margin-top: 20px;"></div>
	
	
    <script src="script.js"></script>
</body>
</html>
